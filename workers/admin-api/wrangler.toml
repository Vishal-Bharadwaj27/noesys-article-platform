name = "admin-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "noesys-dev"
database_id = "83331df4-d437-4c67-92e4-313065a15762"

[env.development]
routes = [
  { pattern = "api.localhost/admin/*", zone_name = "localhost" }
]

[env.production]
routes = [
  { pattern = "api.example.com/admin/*", zone_name = "example.com" }
]
